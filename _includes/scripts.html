<script type="text/javascript">

/*      Slides       */

/* The trigger is a real <button> now (it was an empty <a>), so the panel can
   be driven from the keyboard: Escape closes it, focus returns to the
   trigger, and aria-expanded / aria-hidden track the state for assistive
   tech. The close-on-click surfaces are the ones the theme already used. */

(function ($) {
    "use strict";

    var $trigger  = $("#slide");
    var $sidebar  = $("#sidebar");
    var $surfaces = $("#sidebar,body,#slide,#fade");

    function isOpen() {
        return $("body").hasClass("slide");
    }

    function setOpen(open) {
        $surfaces.toggleClass("slide", open);
        $trigger.attr("aria-expanded", open ? "true" : "false");
        $sidebar.attr("aria-hidden", open ? "false" : "true");
    }

    function close(returnFocus) {
        if (!isOpen()) { return; }
        setOpen(false);
        if (returnFocus) { $trigger.trigger("focus"); }
    }

    $trigger.on("click", function () {
        setOpen(!isOpen());
    });

    $("#fade,#header,#posts-container").on("click", function () {
        close(true);
    });

    $(document).on("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
            close(true);
        }
    });

    /* Start from a known closed state so the off-canvas panel is never
       exposed to assistive tech before the first interaction. */
    setOpen(false);

}(jQuery));

/*      End-Slides      */

</script>

{% if site.search %}
<!-- Jekyll Simple Search: the JSON index is only fetched the first time the
     search overlay is actually opened, so it stays off the critical path for
     every other page view. The index carries post titles and labels only —
     the search matches titles, not body text. -->
<script>
(function () {
  var $searchField = $('.search-field');
  var $results     = $('.search-results');
  var $wrapper     = $('.search-wrapper');
  var $canvas      = $('body');
  var $close       = $('.icon-remove-sign');
  var $button      = $('.dosearch');
  var index = null;
  var pending = null;

  function load(callback) {
    if (index) { callback(index); return; }
    if (!pending) {
      pending = fetch('{{ site.url }}{{ site.baseurl }}/search.json')
        .then(function (r) { return r.json(); })
        .then(function (data) { index = data; return data; });
    }
    pending.then(callback);
  }

  function buildSearch(data) {
    SimpleJekyllSearch({
      searchInput: $searchField[0],
      resultsContainer: $results[0],
      json: data,
      searchResultTemplate: '<li><article><a href="{url}">{title} <span class="entry-date"><time datetime="{date}">{shortdate}</time></span></a></article></li>',
      noResultsText: '<li><p class="search-empty">Nothing found.</p></li>',
      debounceTime: 150
    });
  }

  // Warm the index on hover/focus so the first keystroke is already answered.
  $button.on('mouseenter focus', function () { load(buildSearch); });
  $searchField.on('focus', function () { load(buildSearch); });

  $button.on('click', function () {
    $wrapper.css({ display: "block" });
    $('.search-form').addClass('active');
    $searchField.focus();
    $canvas.addClass('search-overlay');
  });

  function closeSearch() {
    $wrapper.removeAttr('style');
    $('.search-form').removeClass('active');
    $canvas.removeClass('search-overlay');
  }

  $close.on('click', closeSearch);
  $close.on('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeSearch(); } });

  $(document).on('keydown', function (e) {
    if (e.key === 'Escape' && $canvas.hasClass('search-overlay')) { closeSearch(); }
  });
})();
</script>
{% endif %}

</script>
